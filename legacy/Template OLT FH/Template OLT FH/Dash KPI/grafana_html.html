<div class="olt-dashboard">
    <div class="kpi-grid">
        <div class="kpi-card card-total">
            <div class="kpi-title">Total de ONUs</div>
            <div class="kpi-value" id="kpi-total-onu">...</div>
            <div class="kpi-trend">Total provisionado</div>
        </div>
        <div class="kpi-card card-online">
            <div class="kpi-title">ONUs Online</div>
            <div class="kpi-value" id="kpi-onus-online">...</div>
            <div class="kpi-trend">Clientes navegando</div>
        </div>
        <div class="kpi-card card-offline">
            <div class="kpi-title">ONUs Offline</div>
            <div class="kpi-value" id="kpi-onus-offline">...</div>
            <div class="kpi-trend">Fora de sincronia</div>
        </div>
        <div class="kpi-card card-power">
            <div class="kpi-title">Sem Energia (LOS)</div>
            <div class="kpi-value" id="kpi-onus-sem-energia">...</div>
            <div class="kpi-trend">Rompimento ou sem luz</div>
        </div>
        <div class="kpi-card card-falha">
            <div class="kpi-title">ONUs com Falha</div>
            <div class="kpi-value" id="kpi-onus-falha">...</div>
            <div class="kpi-trend">Falhas identificadas</div>
        </div>
        <div class="kpi-card card-temp">
            <div class="kpi-title">Temperatura OLT</div>
            <div class="kpi-value" id="kpi-temp">...</div>
            <div class="kpi-trend">Limite: 48°C</div>
        </div>
        <div class="kpi-card card-uptime">
            <div class="kpi-title">Uptime OLT</div>
            <div class="kpi-value" id="kpi-uptime" style="font-size: 1.6rem;">...</div>
            <div class="kpi-trend">Tempo de atividade</div>
        </div>
    </div>
    <div id="main-grid-container"></div>
</div>
