# =============================================================
# docker-compose.local.yml
# Ambiente de desenvolvimento local (porta 7001)
#
# Como usar:
#   1. Copie .env.local.example para .env
#   2. Gere as chaves SECRET_KEY e FERNET_KEY (instruções no .env)
#   3. docker compose -f docker-compose.local.yml up --build
#
# Acesse: http://localhost:7001
# =============================================================

services:

  # ── Nginx (proxy reverso) ─────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "7001:7001"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - dashboard
    networks:
      - trilan_local

  # ── API (FastAPI) ─────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      # Volume local para persistir ZIPs de backup
      - trilan_backups_local:/data/backups
      # Hot-reload: monta o código diretamente (descomentar para dev sem rebuild)
      # - ./api:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trilan_local

  # ── Dashboard (React/Vite → Nginx) ────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # URL da API vista pelo browser — vazio = mesmo host (via nginx)
        VITE_API_URL: ""
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - trilan_local

  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pg_data_local:/var/lib/postgresql/data
    ports:
      # Expõe o banco localmente para acesso com DBeaver/pgAdmin
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-trilan} -d $${POSTGRES_DB:-trilan_backup}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trilan_local

volumes:
  pg_data_local:
  trilan_backups_local:

networks:
  trilan_local:
    driver: bridge
